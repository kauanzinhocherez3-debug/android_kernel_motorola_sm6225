name: Compilar KernelSU Moto G42
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Baixar Codigo
      uses: actions/checkout@v4

    - name: Configurar Ferramentas e Clang do Google (AOSP)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libssl-dev libcrypto++-dev bison flex libelf-dev lld llvm
        
        # Baixando o Clang oficial que o Google usa para compilar o Android
        mkdir -p $GITHUB_WORKSPACE/aosp-clang
        cd $GITHUB_WORKSPACE/aosp-clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
        tar -xf clang-r487747c.tar.gz

    - name: Injetar KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

    - name: Compilar Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Colocando o Clang do Google no comando principal do sistema
        export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
        
        # Comandos de compilação usando as ferramentas oficiais do Android
        make vendor/hawao_defconfig
        make CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

    - name: Guardar Kernel Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_MotoG42_KSU
        path: arch/arm64/boot/Image
