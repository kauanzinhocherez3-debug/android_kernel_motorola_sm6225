name: Compilar KernelSU Moto G42
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar Codigo
      uses: actions/checkout@v4

    - name: Configurar Ferramentas e Compilador Otimizado
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libssl-dev libcrypto++-dev bison flex libelf-dev lld llvm
        
        # Baixando a Proton Clang (Toolchain oficial do Android compactada de forma leve)
        mkdir -p $GITHUB_WORKSPACE/proton-clang
        cd $GITHUB_WORKSPACE/proton-clang
        wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
        tar -xf master.tar.gz --strip-components=1

    - name: Injetar KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

    - name: Compilar Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Adicionando o novo compilador no caminho do sistema
        export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
        
        # Gerando o arquivo de configuração do Moto G42
        make vendor/hawao_defconfig
        
        # Compilando usando a Proton Clang (que já faz o papel de assembler e cross-compiler)
        make CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j$(nproc)

    - name: Guardar Kernel Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_MotoG42_KSU
        path: arch/arm64/boot/Image
