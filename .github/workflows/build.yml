name: Compilar KernelSU Moto G42
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar Codigo
      uses: actions/checkout@v4

    - name: Configurar Ferramentas e Compiladores do Google
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libssl-dev libcrypto++-dev bison flex libelf-dev lld llvm
        
        # Baixando o Clang oficial do Google (Android)
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
        tar -xf clang-r487747c.tar.gz
        
        # Baixando o GCC Aarch64 para compatibilidade de montagem
        mkdir -p $GITHUB_WORKSPACE/gcc64
        cd $GITHUB_WORKSPACE/gcc64
        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/main.tar.gz
        tar -xf main.tar.gz

    - name: Injetar KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

    - name: Compilar Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Adicionando os compiladores baixados no caminho do sistema
        export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
        
        # Compilação limpa direto na raiz para evitar o erro do script "not found"
        make vendor/hawao_defconfig
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- -j$(nproc)

    - name: Guardar Kernel Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_MotoG42_KSU
        path: arch/arm64/boot/Image
